<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejemplo HTTP POST</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 700px;
            margin: 40px auto;
            padding: 0 20px;
            color: #243447;
        }

        form {
            display: grid;
            gap: 12px;
            max-width: 420px;
        }

        input,
        textarea,
        button {
            font: inherit;
            padding: 10px;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        button {
            border: 0;
            border-radius: 4px;
            background: #1769aa;
            color: white;
            cursor: pointer;
        }

        button:disabled {
            background: #8aa9bf;
            cursor: wait;
        }

        pre {
            min-height: 120px;
            padding: 16px;
            overflow-x: auto;
            background: #f1f3f5;
            border: 1px solid #d8dee4;
        }
    </style>
</head>
<body>
    <h1>Ejemplo sencillo de HTTP POST</h1>
    <p>El formulario envía información a un servidor de prueba.</p>

    <form id="formulario">
        <label for="titulo">Título</label>
        <input id="titulo" name="titulo" type="text" required value="Mi publicación">

        <label for="contenido">Contenido</label>
        <textarea id="contenido" name="contenido" required>Este es el contenido de ejemplo.</textarea>

        <button id="enviarBtn" type="submit">Enviar solicitud POST</button>
    </form>

    <pre id="resultado">La respuesta aparecerá aquí.</pre>

    <script>
        const formulario = document.getElementById("formulario");
        const enviarBtn = document.getElementById("enviarBtn");
        const resultado = document.getElementById("resultado");

        formulario.addEventListener("submit", async (evento) => {
            // Evitamos que el navegador recargue la página al enviar el formulario.
            evento.preventDefault();

            // Creamos un objeto con los datos escritos por el usuario.
            const datos = {
                title: document.getElementById("titulo").value,
                body: document.getElementById("contenido").value,
                userId: 1
            };

            enviarBtn.disabled = true;
            resultado.textContent = "Enviando información...";

            try {
                // fetch() realiza la solicitud HTTP POST.
                // method indica que queremos enviar o crear información.
                const respuesta = await fetch("https://jsonplaceholder.typicode.com/posts", {
                    method: "POST",
                    headers: {
                        // Indicamos al servidor que el cuerpo contiene datos JSON.
                        "Content-Type": "application/json"
                    },
                    // JSON.stringify convierte el objeto JavaScript en texto JSON.
                    body: JSON.stringify(datos)
                });

                // Verificamos si el servidor respondió correctamente.
                if (!respuesta.ok) {
                    throw new Error(`Error HTTP: ${respuesta.status}`);
                }

                // Convertimos la respuesta JSON del servidor en un objeto JavaScript.
                const publicacionCreada = await respuesta.json();

                // Mostramos la respuesta, que incluye normalmente un nuevo id.
                resultado.textContent = JSON.stringify(publicacionCreada, null, 2);
            } catch (error) {
                // Capturamos errores de red o respuestas no exitosas.
                resultado.textContent = `No se pudo enviar la información: ${error.message}`;
            } finally {
                // Permitimos enviar otra solicitud cuando la actual termina.
                enviarBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
